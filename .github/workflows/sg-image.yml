name: Singapore deployment image
on:
  push:
    branches: [ops/sg-build-209]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e35ed94458475bb985616fcf8c615894b166084
          persist-credentials: false
      - name: Build the beta release for Lightsail
        env:
          APP_SHA: 5e35ed94458475bb985616fcf8c615894b166084
        run: |
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/release"
          git archive "$APP_SHA" | tar -x -C "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src"
          sed -i '/^FROM base AS build/a ENV NEXT_PUBLIC_PERIPLUS_MANUAL_RECEIPTS=true NEXT_PUBLIC_PERIPLUS_APP_URL=https://beta.periplus.cc NEXT_PUBLIC_PERIPLUS_SHOW_MOCK_ACCOUNTS=false NEXT_TELEMETRY_DISABLED=1' Dockerfile
          docker build --build-arg PERIPLUS_RELEASE_SHA="$APP_SHA" -t periplus:sg-5e35ed9 .
          cd "$RUNNER_TEMP/release"
          docker save periplus:sg-5e35ed9 | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: periplus-sg-image
          path: ${{ runner.temp }}/release/
          compression-level: 0
          retention-days: 1
