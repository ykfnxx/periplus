<h2>首页布局：Google Maps 风格</h2>
<p class="subtitle">地图为底，左侧浮窗可切换卡片。参考 Google Maps 的交互模式。</p>

<div class="mockup">
  <div class="mockup-header">首页布局示意</div>
  <div class="mockup-body" style="position:relative; height:400px; background:#e2e8f0; overflow:hidden;">
    <!-- 地图底图占位 -->
    <div style="position:absolute; inset:0; background: repeating-linear-gradient(45deg, #cbd5e1 0, #cbd5e1 1px, transparent 1px, transparent 20px), repeating-linear-gradient(-45deg, #cbd5e1 0, #cbd5e1 1px, transparent 1px, transparent 20px); display:flex; align-items:center; justify-content:center;">
      <span style="color:#94a3b8; font-size:14px;">🗺️ 高德地图底图</span>
    </div>

    <!-- 顶部搜索栏 -->
    <div style="position:absolute; top:16px; left:16px; right:16px; display:flex; gap:8px; align-items:center; z-index:10;">
      <div style="flex:1; max-width:480px; background:white; border-radius:24px; padding:10px 16px; box-shadow:0 2px 8px rgba(0,0,0,0.1); display:flex; align-items:center; gap:8px;">
        <span style="color:#f59e0b;">🔍</span>
        <span style="color:#94a3b8; font-size:14px;">搜索地点、路线...</span>
      </div>
      <div style="width:40px; height:40px; background:white; border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,0.1); display:flex; align-items:center; justify-content:center;">
        <span>👤</span>
      </div>
    </div>

    <!-- 左侧浮窗 -->
    <div style="position:absolute; top:72px; left:16px; width:360px; max-height:calc(100% - 88px); background:white; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.12); overflow:hidden; display:flex; flex-direction:column; z-index:10;">
      <!-- 浮窗头部切换 Tab -->
      <div style="display:flex; border-bottom:1px solid #e2e8f0; padding:0 4px;">
        <div style="flex:1; padding:12px; text-align:center; font-size:13px; font-weight:600; color:#f59e0b; border-bottom:2px solid #f59e0b;">路线</div>
        <div style="flex:1; padding:12px; text-align:center; font-size:13px; color:#64748b;">已保存</div>
        <div style="flex:1; padding:12px; text-align:center; font-size:13px; color:#64748b;">探索</div>
      </div>
      <!-- 浮窗内容 -->
      <div style="padding:16px; overflow-y:auto; flex:1;">
        <div style="display:flex; gap:12px; margin-bottom:12px;">
          <div style="width:80px; height:60px; background:#fef3c7; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px;">🏜️</div>
          <div>
            <div style="font-weight:600; font-size:14px; color:#1e293b;">丝绸之路</div>
            <div style="font-size:12px; color:#64748b; margin-top:2px;">西安 → 乌鲁木齐 · 7 个地点</div>
            <div style="font-size:12px; color:#f59e0b; margin-top:4px;">⭐ 经典路线</div>
          </div>
        </div>
        <div style="display:flex; gap:12px; margin-bottom:12px;">
          <div style="width:80px; height:60px; background:#dcfce7; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px;">🍵</div>
          <div>
            <div style="font-weight:600; font-size:14px; color:#1e293b;">茶马古道</div>
            <div style="font-size:12px; color:#64748b; margin-top:2px;">昆明 → 拉萨 · 6 个地点</div>
          </div>
        </div>
        <div style="display:flex; gap:12px;">
          <div style="width:80px; height:60px; background:#dbeafe; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px;">🏔️</div>
          <div>
            <div style="font-weight:600; font-size:14px; color:#1e293b;">川藏线</div>
            <div style="font-size:12px; color:#64748b; margin-top:2px;">成都 → 拉萨 · 8 个地点</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右下角操作按钮 -->
    <div style="position:absolute; bottom:24px; right:24px; display:flex; flex-direction:column; gap:8px; z-index:10;">
      <div style="width:48px; height:48px; background:white; border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,0.15); display:flex; align-items:center; justify-content:center; font-size:20px;">📍</div>
      <div style="width:48px; height:48px; background:#f59e0b; border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,0.2); display:flex; align-items:center; justify-content:center; font-size:20px; color:white;">+</div>
    </div>
  </div>
</div>

<p class="subtitle" style="margin-top:16px;">这个布局方向对吗？左侧浮窗的 Tab 切换（路线 / 已保存 / 探索）是否符合你的预期？</p>
