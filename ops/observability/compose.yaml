name: periplus-observability

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    depends_on:
      - tempo
      - prometheus
      - phoenix
    ports:
      - "${PERIPLUS_OBSERVABILITY_BIND_HOST:-127.0.0.1}:4318:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped
    volumes:
      - tempo-data:/var/tempo
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
    ports:
      - "${PERIPLUS_OBSERVABILITY_BIND_HOST:-127.0.0.1}:${PERIPLUS_GRAFANA_PORT:-3003}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set at runtime}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set at runtime}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  phoenix:
    image: arizephoenix/phoenix:version-9.0.0
    restart: unless-stopped
    ports:
      - "${PERIPLUS_OBSERVABILITY_BIND_HOST:-127.0.0.1}:${PERIPLUS_PHOENIX_PORT:-6008}:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "30"
    volumes:
      - phoenix-data:/mnt/data

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
  phoenix-data:
