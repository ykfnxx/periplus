receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    send_batch_size: 256
    timeout: 1s
  attributes/tempo:
    actions:
      - key: input.value
        action: delete
      - key: output.value
        action: delete
      - key: llm.prompts
        action: delete
      - key: llm.input_messages
        action: delete
      - key: llm.output_messages
        action: delete
      - key: url.full
        action: delete
      - key: http.url
        action: delete
      - key: url.query
        action: delete
      - key: http.target
        action: delete
      - key: periplus.stream.first_delta
        action: delete
      - key: periplus.stream.last_delta
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
  filter/phoenix:
    error_mode: ignore
    traces:
      span:
        - 'not (name == "agent.run" or name == "agent.run.rejection" or name == "agent.tool" or name == "agent.prompt.build" or name == "agent.runtime.start" or name == "agent.runtime.stream" or name == "agent.stream.persist" or name == "agent.summary.retry" or name == "agent.baseline.load" or name == "agent.final_head_gate" or name == "provider.request" or name == "llm.request" or name == "workspace.command" or IsMatch(name, "^draft\\."))'
  attributes/phoenix:
    actions:
      - key: capabilityToken
        action: delete
      - key: periplus.capability_token
        action: delete
      - key: authorization
        action: delete
      - key: api.key
        action: delete
      - key: url.full
        action: delete
      - key: http.url
        action: delete
      - key: url.query
        action: delete
      - key: http.target
        action: delete
      - key: periplus.stream.first_delta
        action: delete
      - key: periplus.stream.last_delta
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete

connectors:
  spanmetrics:
    dimensions:
      - name: http.request.method
      - name: http.route
      - name: http.response.status_code
    metrics_flush_interval: 15s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp/phoenix:
    endpoint: phoenix:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces/tempo:
      receivers: [otlp]
      processors: [memory_limiter, attributes/tempo, batch]
      exporters: [otlp/tempo, spanmetrics]
    traces/phoenix:
      receivers: [otlp]
      processors: [memory_limiter, filter/phoenix, attributes/phoenix, batch]
      exporters: [otlp/phoenix]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
